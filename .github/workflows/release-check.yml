name: 发布检查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: git archive --format=tar.gz --output=pole-client-go-candidate.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pole-client-go-candidate
          path: pole-client-go-candidate.tar.gz
          if-no-files-found: error
